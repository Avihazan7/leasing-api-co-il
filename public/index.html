<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>ULease OS — Claude Operating System</title>
<meta name="description" content="ULease 🎯 Leasing.co.il — Claude Operating System (מודולי מתודולוגיה ואסטרטגיה)." />
<style>
  :root{ --teal:#0d9488; --cyan:#22d3ee; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; font-family:system-ui,"Segoe UI",Arial,sans-serif; color:#0f172a;
    background:#f6feff; display:grid; place-items:center; padding:24px; overflow:hidden; }
  /* signature ULease mesh ambiance */
  body::before{ content:""; position:fixed; inset:-10%; z-index:-1; filter:blur(8px); background:
    radial-gradient(40% 38% at 18% 12%, rgba(20,184,166,.20), transparent 70%),
    radial-gradient(42% 40% at 86% 18%, rgba(56,189,248,.16), transparent 72%),
    radial-gradient(46% 44% at 78% 88%, rgba(129,140,248,.12), transparent 72%),
    radial-gradient(40% 38% at 22% 84%, rgba(16,185,129,.12), transparent 72%); }
  .card{ max-width:640px; background:rgba(255,255,255,.85); backdrop-filter:blur(8px);
    border:1px solid #D8EEF4; border-radius:24px; padding:40px 32px; text-align:center;
    box-shadow:0 10px 40px rgba(13,148,136,.12); }
  .logo{ font-weight:900; font-size:28px; letter-spacing:.5px;
    background:linear-gradient(135deg,#0d9488,#22d3ee,#0ea5e9); -webkit-background-clip:text;
    background-clip:text; -webkit-text-fill-color:transparent; }
  h1{ font-size:20px; margin:18px 0 6px; }
  p{ color:#475569; line-height:1.6; margin:6px 0; }
  .pill{ display:inline-block; margin-top:16px; font-weight:800; font-size:13px;
    color:var(--teal); background:#e6fbff; border:1px solid #D8EEF4; border-radius:999px; padding:8px 16px; }
  a{ color:var(--teal); font-weight:700; text-decoration:none; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">ULease 🎯 Leasing.co.il</div>
    <h1>Claude Operating System</h1>
    <p>זהו ריפו ה-<b>תיעוד והמתודולוגיה</b> (Docs OS) — מודולי אסטרטגיה, ארכיטקטורה ו-<b>ULease OS X (UDM)</b>.</p>
    <p>האפליקציה והקטלוג החיים נמצאים ב-<a href="https://leasing.co.il/ui/">leasing.co.il</a>.</p>
    <span class="pill">📚 Methodology · Architecture · Governance</span>
  </main>
</body>
</html>
